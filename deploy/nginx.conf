# OpenVPN Dashboard — Nginx reverse proxy snippet
#
# HOW TO ENABLE:
#   1. Replace "your-domain.com" with your actual domain name.
#   2. Copy or symlink this file into /etc/nginx/sites-available/:
#        sudo cp nginx.conf /etc/nginx/sites-available/openvpn-dashboard
#   3. Enable the site:
#        sudo ln -s /etc/nginx/sites-available/openvpn-dashboard /etc/nginx/sites-enabled/
#   4. Test and reload:
#        sudo nginx -t && sudo systemctl reload nginx
#
# TLS VIA CERTBOT (Let's Encrypt):
#   Install certbot and the nginx plugin:
#        sudo apt install certbot python3-certbot-nginx
#   Obtain and install a certificate (certbot modifies this file automatically):
#        sudo certbot --nginx -d your-domain.com
#   Certbot will add listen 443 ssl, ssl_certificate, and redirect blocks.
#   Certificates renew automatically via a systemd timer or cron job.

server {
    listen 80;
    server_name your-domain.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
